<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Tracker - Fast Entry</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --profit: #32d74b;
            --loss: #ff453a;
            --border: #2c2c2e;
            --hover-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: left;
        }
        .stat-card span {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .stat-card h3 { margin: 0; font-size: 18px; }
        .text-profit { color: var(--profit); }
        .text-loss { color: var(--loss); }

        /* Calendar */
        .calendar-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        .day-cell {
            aspect-ratio: 1;
            background-color: rgba(255,255,255,0.03);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            padding: 5px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            position: relative;
        }
        .day-cell:hover {
            background-color: var(--hover-bg);
            border: 1px solid var(--border);
            transform: scale(1.05);
        }
        .day-cell .date-num { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; pointer-events: none; }
        .day-cell .day-pnl { font-size: 12px; font-weight: bold; pointer-events: none; }

        /* Quick Input Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 300px;
            text-align: center;
        }
        .modal-content h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-actions button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        .btn-cancel { background: var(--bg-dark); color: white; border: 1px solid var(--border); }
        .btn-save { background: white; color: black; }
    </style>
</head>
<body>

<div class="container">
    <!-- Stats Section -->
    <div class="stats-grid">
        <div class="stat-card">
            <span>Month P&L</span>
            <h3 id="stat-month-pnl">$0</h3>
        </div>
        <div class="stat-card">
            <span>Win Rate</span>
            <h3 id="stat-winrate">0%</h3>
        </div>
        <div class="stat-card">
            <span>Trading Days</span>
            <h3 id="stat-days">0</h3>
        </div>
        <div class="stat-card">
            <span>Best Day</span>
            <h3 id="stat-best" class="text-profit">+$0</h3>
        </div>
        <div class="stat-card">
            <span>Worst Day</span>
            <h3 id="stat-worst" class="text-loss">-$0</h3>
        </div>
        <div class="stat-card">
            <span>Profit Factor</span>
            <h3 id="stat-pf">0.00</h3>
        </div>
    </div>

    <!-- Calendar Section -->
    <div class="calendar-container">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <span style="font-weight: bold;" id="current-month-display">September 2026</span>
        </div>
        <div class="weekdays">
            <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
        </div>
        <div class="days" id="calendar-days">
            <!-- JS will generate days here -->
        </div>
    </div>
</div>

<!-- Fast Entry Modal -->
<div class="modal" id="quickModal">
    <div class="modal-content">
        <h3>Date: <span id="display-date-modal" style="color:var(--profit);"></span></h3>
        <form id="quickForm">
            <input type="hidden" id="q-date">
            <input type="number" id="q-pnl" step="0.01" required placeholder="กำไร/ขาดทุน (เช่น 150 หรือ -50)" autocomplete="off">
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
                <button type="submit" class="btn-save">บันทึก</button>
            </div>
        </form>
    </div>
</div>

<script>
    // เก็บข้อมูลยอดรวมรายวัน
    let dailyPnl = {}; 

    // เปิด Modal เมื่อกดที่วันที่
    function openQuickEntry(dateString) {
        document.getElementById('q-date').value = dateString;
        document.getElementById('display-date-modal').innerText = dateString;
        
        // ดึงค่ายอดเงินเดิมมาโชว์ (ถ้ามี)
        document.getElementById('q-pnl').value = dailyPnl[dateString] || '';
        
        document.getElementById('quickModal').style.display = 'flex';
        
        // Auto focus ให้พิมพ์ตัวเลขได้เลยไม่ต้องเอาเมาส์ไปคลิกซ้ำ
        setTimeout(() => {
            document.getElementById('q-pnl').focus();
        }, 100);
    }

    function closeModal() {
        document.getElementById('quickModal').style.display = 'none';
    }

    // เมื่อกดปุ่มบันทึก
    document.getElementById('quickForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const date = document.getElementById('q-date').value;
        const pnl = parseFloat(document.getElementById('q-pnl').value);
        
        // อัปเดตข้อมูลของวันนั้น
        if (!isNaN(pnl)) {
            dailyPnl[date] = pnl;
        } else {
            delete dailyPnl[date]; // ถ้าลบข้อความออก ให้ลบข้อมูลทิ้ง
        }
        
        updateDashboard();
        closeModal();
    });

    function updateDashboard() {
        let totalPnl = 0, winCount = 0, grossProfit = 0, grossLoss = 0;
        const daysArray = Object.values(dailyPnl);
        const tradingDays = daysArray.length;

        daysArray.forEach(pnl => {
            totalPnl += pnl;
            if (pnl > 0) { winCount++; grossProfit += pnl; }
            if (pnl < 0) { grossLoss += Math.abs(pnl); }
        });

        // คำนวณสถิติ
        const winRate = tradingDays > 0 ? ((winCount / tradingDays) * 100).toFixed(0) : 0;
        const profitFactor = grossLoss === 0 ? (grossProfit > 0 ? grossProfit : 0) : (grossProfit / grossLoss);
        const bestDay = daysArray.length > 0 ? Math.max(...daysArray, 0) : 0;
        const worstDay = daysArray.length > 0 ? Math.min(...daysArray, 0) : 0;

        // อัปเดตหน้าจอ
        const pnlEl = document.getElementById('stat-month-pnl');
        pnlEl.innerText = (totalPnl >= 0 ? '+' : '') + '$' + totalPnl.toFixed(0);
        pnlEl.className = totalPnl >= 0 ? 'text-profit' : 'text-loss';

        document.getElementById('stat-winrate').innerText = winRate + '%';
        document.getElementById('stat-days').innerText = tradingDays;
        document.getElementById('stat-best').innerText = '+$' + bestDay.toFixed(0);
        document.getElementById('stat-worst').innerText = '-$' + Math.abs(worstDay).toFixed(0);
        document.getElementById('stat-pf').innerText = profitFactor.toFixed(2);

        renderCalendar();
    }

    function renderCalendar() {
        const calContainer = document.getElementById('calendar-days');
        calContainer.innerHTML = '';
        
        // สมมติให้เดือนกันยายน 2026 วันที่ 1 เริ่มวันอังคาร (เว้น 1 ช่องของวันจันทร์)
        const emptyStartDays = 1; 
        
        for(let i = 0; i < emptyStartDays; i++) {
            calContainer.innerHTML += `<div></div>`;
        }

        for(let day = 1; day <= 30; day++) {
            const dateStr = `2026-09-${String(day).padStart(2, '0')}`;
            const pnl = dailyPnl[dateStr] || 0;
            
            let pnlHtml = '';
            if (pnl > 0) {
                pnlHtml = `<span class="day-pnl text-profit">+$${pnl}</span>`;
            } else if (pnl < 0) {
                pnlHtml = `<span class="day-pnl text-loss">-$${Math.abs(pnl)}</span>`;
            }

            // แสดงวันที่และยอดเงิน กดคลิกเพื่อเปิดหน้าต่างกรอกข้อมูล
            calContainer.innerHTML += `
                <div class="day-cell" onclick="openQuickEntry('${dateStr}')">
                    <span class="date-num">${day}</span>
                    ${pnlHtml}
                </div>
            `;
        }
    }

    // เรียกฟังก์ชันวาดปฏิทินตอนเริ่มต้น
    renderCalendar();
</script>

</body>
</html>
