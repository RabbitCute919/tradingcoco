<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Arduino Wiring Animation - Gas Detector</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h2 { margin-bottom: 5px; color: #00d2d3; }
    #desc {
      font-size: 18px;
      margin-bottom: 15px;
      height: 40px;
      color: #ff9f43;
      text-align: center;
    }
    svg {
      background: #27293d;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .btn-group {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }
    button {
      background: #0abde3;
      color: #fff;
      border: none;
      padding: 10px 22px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #48dbfb; }
    button:disabled { background: #576574; cursor: not-allowed; }

    /* Animation effects */
    .wire {
      stroke-dasharray: 8;
      animation: dash 1s linear infinite;
      transition: opacity 0.5s ease-in-out;
    }
    @keyframes dash {
      to { stroke-dashoffset: -16; }
    }
  </style>
</head>
<body>

  <h2>แอนิเมชันขั้นตอนการต่อวงจรตรวจจับแก๊ส</h2>
  <div id="desc">กดปุ่ม "ขั้นตอนถัดไป" เพื่อเริ่มดูการต่อสายทีละเส้น</div>

  <svg width="860" height="520" viewBox="0 0 860 520">
    <!-- Arduino Uno Board -->
    <rect x="280" y="140" width="280" height="230" rx="10" fill="#0984e3" stroke="#74b9ff" stroke-width="3"/>
    <text x="420" y="250" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">Arduino UNO R3</text>
    
    <!-- Power/GND Pins Header Bottom -->
    <rect x="330" y="350" width="180" height="15" fill="#2d3436"/>
    <!-- Digital Pins Header Top -->
    <rect x="330" y="145" width="220" height="15" fill="#2d3436"/>

    <!-- Pin Labels UNO -->
    <text x="360" y="340" fill="#dfe6e9" font-size="11" text-anchor="middle">5V</text>
    <circle id="pin-5v" cx="360" cy="357" r="4" fill="#ff7675"/>

    <text x="390" y="340" fill="#dfe6e9" font-size="11" text-anchor="middle">GND</text>
    <circle id="pin-gnd" cx="390" cy="357" r="4" fill="#636e72"/>

    <text x="470" y="340" fill="#dfe6e9" font-size="11" text-anchor="middle">A0</text>
    <circle id="pin-a0" cx="470" cy="357" r="4" fill="#a29bfe"/>

    <text x="495" y="175" fill="#dfe6e9" font-size="11" text-anchor="middle">D3</text>
    <circle id="pin-d3" cx="495" cy="153" r="4" fill="#ffeaa7"/>

    <text x="435" y="175" fill="#dfe6e9" font-size="11" text-anchor="middle">D9</text>
    <circle id="pin-d9" cx="435" cy="153" r="4" fill="#ff7675"/>

    <text x="415" y="175" fill="#dfe6e9" font-size="11" text-anchor="middle">D10</text>
    <circle id="pin-d10" cx="415" cy="153" r="4" fill="#55efc4"/>

    <text x="395" y="175" fill="#dfe6e9" font-size="11" text-anchor="middle">D11</text>
    <circle id="pin-d11" cx="395" cy="153" r="4" fill="#74b9ff"/>

    <!-- Module 1: MQ-2 (Left) -->
    <g transform="translate(40, 180)">
      <rect width="130" height="140" rx="8" fill="#2d3436" stroke="#636e72" stroke-width="2"/>
      <circle cx="65" cy="60" r="35" fill="#b2bec3" stroke="#dfe6e9" stroke-width="2"/>
      <text x="65" y="65" fill="#2d3436" font-size="13" font-weight="bold" text-anchor="middle">MQ-2</text>
      <!-- Pins -->
      <circle id="mq-vcc" cx="130" cy="30" r="4" fill="#ff7675"/><text x="115" y="34" fill="#fff" font-size="10">VCC</text>
      <circle id="mq-gnd" cx="130" cy="60" r="4" fill="#636e72"/><text x="115" y="64" fill="#fff" font-size="10">GND</text>
      <circle id="mq-a0"  cx="130" cy="90" r="4" fill="#a29bfe"/><text x="115" y="94" fill="#fff" font-size="10">A0</text>
    </g>

    <!-- Module 2: Passive Buzzer 3-pin (Top Right) -->
    <g transform="translate(670, 40)">
      <rect width="130" height="110" rx="8" fill="#2d3436" stroke="#636e72" stroke-width="2"/>
      <circle cx="65" cy="45" r="25" fill="#1e272e" stroke="#485460" stroke-width="2"/>
      <text x="65" y="50" fill="#fff" font-size="12" text-anchor="middle">Buzzer</text>
      <!-- Pins -->
      <circle id="bz-vcc" cx="0" cy="30" r="4" fill="#ff7675"/><text x="12" y="34" fill="#fff" font-size="10">VCC</text>
      <circle id="bz-gnd" cx="0" cy="55" r="4" fill="#636e72"/><text x="12" y="59" fill="#fff" font-size="10">GND</text>
      <circle id="bz-io"  cx="0" cy="80" r="4" fill="#ffeaa7"/><text x="12" y="84" fill="#fff" font-size="10">I/O</text>
    </g>

    <!-- Module 3: KY-016 RGB LED (Bottom Right) -->
    <g transform="translate(670, 310)">
      <rect width="130" height="140" rx="8" fill="#2d3436" stroke="#636e72" stroke-width="2"/>
      <circle cx="65" cy="55" r="22" fill="#dfe6e9" opacity="0.8"/>
      <text x="65" y="60" fill="#2d3436" font-size="11" font-weight="bold" text-anchor="middle">RGB LED</text>
      <!-- Pins -->
      <circle id="rgb-gnd" cx="0" cy="30" r="4" fill="#636e72"/><text x="12" y="34" fill="#fff" font-size="10">- (GND)</text>
      <circle id="rgb-r"   cx="0" cy="55" r="4" fill="#ff7675"/><text x="12" y="59" fill="#fff" font-size="10">R</text>
      <circle id="rgb-g"   cx="0" cy="80" r="4" fill="#55efc4"/><text x="12" y="84" fill="#fff" font-size="10">G</text>
      <circle id="rgb-b"   cx="0" cy="105" r="4" fill="#74b9ff"/><text x="12" y="109" fill="#fff" font-size="10">B</text>
    </g>

    <!-- WIRES (เส้นต่อสายไฟ) -->
    <!-- W1: MQ2 VCC -> 5V -->
    <path id="w1" class="wire" d="M 170 210 C 230 210, 260 410, 360 357" fill="none" stroke="#e74c3c" stroke-width="3" opacity="0"/>
    <!-- W2: MQ2 GND -> GND -->
    <path id="w2" class="wire" d="M 170 240 C 240 240, 280 430, 390 357" fill="none" stroke="#2d3436" stroke-width="3" opacity="0"/>
    <!-- W3: MQ2 A0 -> A0 -->
    <path id="w3" class="wire" d="M 170 270 C 270 270, 360 460, 470 357" fill="none" stroke="#9b59b6" stroke-width="3" opacity="0"/>
    <!-- W4: Buzzer VCC -> 5V -->
    <path id="w4" class="wire" d="M 670 70 C 580 70, 320 300, 360 357" fill="none" stroke="#e74c3c" stroke-width="3" opacity="0"/>
    <!-- W5: Buzzer GND -> GND -->
    <path id="w5" class="wire" d="M 670 95 C 600 95, 360 310, 390 357" fill="none" stroke="#2d3436" stroke-width="3" opacity="0"/>
    <!-- W6: Buzzer I/O -> D3 -->
    <path id="w6" class="wire" d="M 670 120 C 580 120, 530 110, 495 153" fill="none" stroke="#f1c40f" stroke-width="3" opacity="0"/>
    <!-- W7: RGB - (GND) -> GND -->
    <path id="w7" class="wire" d="M 670 340 C 550 340, 430 420, 390 357" fill="none" stroke="#2d3436" stroke-width="3" opacity="0"/>
    <!-- W8: RGB R -> D9 -->
    <path id="w8" class="wire" d="M 670 365 C 600 365, 460 70, 435 153" fill="none" stroke="#e84118" stroke-width="3" opacity="0"/>
    <!-- W9: RGB G -> D10 -->
    <path id="w9" class="wire" d="M 670 390 C 620 390, 440 60, 415 153" fill="none" stroke="#4cd137" stroke-width="3" opacity="0"/>
    <!-- W10: RGB B -> D11 -->
    <path id="w10" class="wire" d="M 670 415 C 640 415, 420 50, 395 153" fill="none" stroke="#00a8ff" stroke-width="3" opacity="0"/>
  </svg>

  <div class="btn-group">
    <button id="prevBtn" onclick="prevStep()" disabled>ย้อนกลับ</button>
    <button id="nextBtn" onclick="nextStep()">ขั้นตอนถัดไป</button>
    <button onclick="resetAll()">เริ่มใหม่</button>
  </div>

  <script>
    let step = 0;
    const steps = [
      { text: "กด 'ขั้นตอนถัดไป' เพื่อเริ่มต่อวงจร", wires: [] },
      { text: "1. ต่อสายไฟเลี้ยง MQ-2 (VCC) สีแดง เข้าพิน 5V ของบอร์ด Arduino", wires: ["w1"] },
      { text: "2. ต่อสายกราวด์ MQ-2 (GND) สีดำ เข้าพิน GND", wires: ["w2"] },
      { text: "3. ต่อขาสัญญาณ MQ-2 (A0) สีม่วง เข้าพินอนาล็อก A0", wires: ["w3"] },
      { text: "4. ต่อไฟเลี้ยง Buzzer (VCC) สีแดง ร่วมกับราง 5V", wires: ["w4"] },
      { text: "5. ต่อกราวด์ Buzzer (GND) สีดำ เข้า GND", wires: ["w5"] },
      { text: "6. ต่อขาสัญญาณ Buzzer (I/O) สีเหลือง เข้าพิน D3 (PWM)", wires: ["w6"] },
      { text: "7. ต่อขากราวด์ RGB LED (-) สีดำ เข้า GND", wires: ["w7"] },
      { text: "8. ต่อขา R (สีแดง) ของ LED RGB เข้าพิน D9", wires: ["w8"] },
      { text: "9. ต่อขา G (สีเขียว) ของ LED RGB เข้าพิน D10", wires: ["w9"] },
      { text: "10. ต่อขา B (สีน้ำเงิน) ของ LED RGB เข้าพิน D11 (เสร็จสิ้นวงจร!)", wires: ["w10"] }
    ];

    function updateView() {
      document.getElementById('desc').innerText = steps[step].text;
      for (let i = 1; i <= 10; i++) {
        const wire = document.getElementById('w' + i);
        wire.style.opacity = (i <= step) ? "1" : "0";
      }
      document.getElementById('prevBtn').disabled = (step === 0);
      document.getElementById('nextBtn').disabled = (step === steps.length - 1);
    }

    function nextStep() {
      if (step < steps.length - 1) {
        step++;
        updateView();
      }
    }

    function prevStep() {
      if (step > 0) {
        step--;
        updateView();
      }
    }

    function resetAll() {
      step = 0;
      updateView();
    }
  </script>
</body>
</html>
